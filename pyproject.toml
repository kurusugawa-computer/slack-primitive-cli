[project]
name = "slack-primitive-cli"
dynamic = ["version"]
description = "Primitive Slack CLI"
authors = [{ name = "Kurusugawa Computer Inc." }]
requires-python = ">=3.12,<4"
readme = "README.md"
license = "MIT"
keywords = ["slack", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["click>=8,<9", "click-option-group", "backoff", "slack-sdk>=3,<4"]

[project.urls]
Repository = "https://github.com/kurusugawa-computer/slack-primitive-cli"

[project.scripts]
slackcli = "slack_primitive_cli.__main__:cli"

[dependency-groups]
linter = [
    "ruff>=0.17.2",
    "mypy>=2.4.0",
]

[tool.uv]
required-version = ">=0.13.4"
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
default-groups = ["linter"]

[tool.ruff]
target-version = "py312"
line-length = 150

[tool.ruff.lint]

ignore = [
    "CPY001", # 既存プロジェクトではファイルごとの著作権表記を行わない
    "G004", # `logging-f-string` : loggingでf-stringを使いたいので無視する
    "PD002", #すでにpandasで`inplace=True`はいろんなところで使っているため
    "RUF001", # 全角記号など`ambiguous unicode character`も使いたいため
    "RUF002",# 全角記号など`ambiguous unicode character`も使いたいため
    "RUF003",# 全角記号など`ambiguous unicode character`も使いたいため
    "PLR2004", # magic-value-comparison: listのサイズで判定するときがよくあるため
    "ERA", # : 役立つこともあるが、コメントアウトしていないコードも警告されるので無視する
    "PERF203", # try-except-in-loop: ループ内でtry-exceptを使うこともあるため無視する。
    "FIX", # TODOやFIXMEを使うため無視する
    "TD", # TODOコメントの書き方に気にしていないので無視する

    # 以下のルールはコードに合っていないので無効化した
    "RSE", # flake8-raise
    "D", # pydocstyle, Docstringを中途半端にしか書いていないので、除外する
    "C90", # mccabe
    "T20", # flake8-print
    "SLF", #  flake8-self
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "TRY", # tryceratops
    "COM", # flake8-commas
    "S", # flake8-bandit
    "EM",#flake8-errmsg
    "EXE", # flake8-executable
    "ICN", # flake8-import-conventions
    "RET",#flake8-return
    "SIM",#flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", #pathlibを使わないコードが多いので、除外する
    "ISC", #flake8-implicit-str-concat
    "N", # pep8-naming
    "PT", # flake8-pytest-style
]


select = [
    "ALL",
]

[tool.ruff.lint.per-file-ignores]
# テストコードはチェックを緩和する
"tests/**.py" = [
    "PGH",  # pygrep-hooks
    "DTZ",  # flake8-datetimez
    "ANN",  # flake8-annotations
    "E501",  # line-too-long
    "RUF100"  # unused-noqa
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pyupgrade]
# https://beta.ruff.rs/docs/settings/#keep-runtime-typing
keep-runtime-typing = true

[tool.ruff.lint.pylint]
max-args = 10

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["slack_primitive_cli"]

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
format = "{base}"
